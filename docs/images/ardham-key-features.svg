<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="cardGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </radialGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.2" />
    </filter>
  </defs>

  <style>
    .title-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="#020617" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Grid Accent Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Brand Header Pill -->
  <g transform="translate(600, 65)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#34d399" class="title-font" font-size="13" letter-spacing="2">ARDHAM (అర్థం) • ARCHITECTURE</text>
  </g>

  <!-- Main Feature Card -->
  <g filter="url(#shadow)">
    <rect x="100" y="115" width="1000" height="360" rx="28" fill="url(#cardGlow)" stroke="url(#borderGrad)" stroke-width="2.5" />

    <!-- 2x2 Grid Divider Lines -->
    <line x1="600" y1="135" x2="600" y2="455" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5" />
    <line x1="130" y1="295" x2="1070" y2="295" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Item 1: Top Left - 100% Offline-Ready -->
    <g transform="translate(145, 160)">
      <!-- Icon Container -->
      <rect x="0" y="0" width="56" height="56" rx="16" fill="#047857" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" />
      <text x="28" y="37" text-anchor="middle" font-size="28">📱</text>

      <g transform="translate(74, 18)">
        <text x="0" y="0" fill="#f8fafc" class="title-font" font-size="20">100% Offline-Ready</text>
        <text x="0" y="24" fill="#94a3b8" class="body-font" font-size="14.5">runs on-device with Wi-Fi switched OFF</text>
      </g>
    </g>

    <!-- Item 2: Top Right - Google Gemma 4 -->
    <g transform="translate(645, 160)">
      <rect x="0" y="0" width="56" height="56" rx="16" fill="#047857" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" />
      <text x="28" y="37" text-anchor="middle" font-size="28">🤖</text>

      <g transform="translate(74, 18)">
        <text x="0" y="0" fill="#f8fafc" class="title-font" font-size="20">Google Gemma 4</text>
        <text x="0" y="24" fill="#94a3b8" class="body-font" font-size="14.5">Apache 2.0 open-weight multimodal SLM</text>
      </g>
    </g>

    <!-- Item 3: Bottom Left - Lakshmi AI Avatar -->
    <g transform="translate(145, 325)">
      <rect x="0" y="0" width="56" height="56" rx="16" fill="#047857" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" />
      <text x="28" y="37" text-anchor="middle" font-size="28">👩‍💼</text>

      <g transform="translate(74, 18)">
        <text x="0" y="0" fill="#f8fafc" class="title-font" font-size="20">Lakshmi AI Avatar</text>
        <text x="0" y="24" fill="#94a3b8" class="body-font" font-size="14.5">real-time procedural voice lip-sync</text>
      </g>
    </g>

    <!-- Item 4: Bottom Right - Tamper-Proof Seal -->
    <g transform="translate(645, 325)">
      <rect x="0" y="0" width="56" height="56" rx="16" fill="#047857" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" />
      <text x="28" y="37" text-anchor="middle" font-size="28">🔒</text>

      <g transform="translate(74, 18)">
        <text x="0" y="0" fill="#f8fafc" class="title-font" font-size="20">Tamper-Proof Seal</text>
        <text x="0" y="24" fill="#94a3b8" class="body-font" font-size="14.5">SHA-256 hash plus scannable QR receipt</text>
      </g>
    </g>
  </g>

  <!-- Bottom Event Attribution Ribbon -->
  <g transform="translate(600, 530)">
    <!-- Pill container -->
    <rect x="-380" y="-22" width="760" height="44" rx="22" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />

    <text x="-345" y="6" font-size="22">🏆</text>
    <text x="-315" y="6" fill="#f1f5f9" class="title-font" font-size="14.5">Major League Hacking | Hack Day Vizag × AI for Vizag</text>

    <!-- Vertical separator -->
    <line x1="140" y1="-10" x2="140" y2="10" stroke="#475569" stroke-width="1.5" />

    <!-- Categories -->
    <text x="160" y="6" fill="#fbbf24" class="title-font" font-size="13">Best Open-Source AI • Build with Gemma</text>
  </g>

  <!-- Sub-caption Tagline -->
  <text x="600" y="595" text-anchor="middle" fill="#64748b" class="body-font" font-size="12.5">
    Multimodal Offline AI Loan Comprehension &amp; Fraud Prevention for Rural India
  </text>
</svg>
